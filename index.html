<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tennis Match Manual Analysis</title>

  <!-- iOS PWA Specific Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tennis Match">
  <meta name="theme-color" content="#0f172a">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Icons & Manifest -->
  <link rel="apple-touch-icon" href="./icons/icon-192.svg">
  <link rel="icon" type="image/svg+xml" href="./icons/icon-192.svg">
  <link rel="manifest" href="./manifest.json">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              lime: '#a3e635',
              dark: '#020617',
              card: '#0f172a',
            }
          }
        }
      }
    }
  </script>

  <!-- App Custom Styles -->
  <link rel="stylesheet" href="./css/app.css">
</head>
<body class="bg-slate-950 text-slate-100 antialiased overflow-hidden">
  
  <div id="app"></div>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('🎾 Tennis PWA SW Registered:', reg.scope))
          .catch((err) => console.warn('PWA SW Registration failed:', err));
      });
    }
  </script>

  <!-- Application Bootstrap -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
